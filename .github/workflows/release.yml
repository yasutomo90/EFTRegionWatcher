name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      EFT_RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - name: Validate stable version tag
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the stable Cargo package version.' }
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        shell: pwsh
        run: ./scripts/test.ps1
      - run: cargo build --locked --release
      - shell: pwsh
        run: ./scripts/package.ps1
      - name: Publish only validated artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" target/dist/EFTRegionWatcher.exe target/dist/EFTRegionWatcher.Updater.exe target/dist/SHA256SUMS.txt target/dist/EFTRegionWatcher-win-x64.zip target/dist/EFTRegionWatcher-win-x64.zip.sha256 --verify-tag --title "EFTRegionWatcher $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
