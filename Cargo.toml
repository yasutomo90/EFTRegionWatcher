[package]
name = "eft-region-watcher"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Passive, native Windows EFT log endpoint viewer"

[lib]
name = "eft_region_watcher"

[[bin]]
name = "EFTRegionWatcher"
path = "src/main.rs"

[[bin]]
name = "EFTRegionWatcherUpdater"
path = "src/bin/updater.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
semver = "1"
sha2 = "0.10"
notify = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell_Common", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinHttp", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"

